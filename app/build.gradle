plugins {
    id 'com.android.application'
}

android {
    namespace 'com.matrixwall'
    compileSdk 34

    defaultConfig {
        applicationId "com.matrixwall.pro"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.1 Pro"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
