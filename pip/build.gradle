plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pip.keypet'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pip.keypet'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
