name: SOULBOUND Android Release
on:
  push:
    branches: [main]
    paths:
      - 'phone-empire/**'
      - 'settings.gradle'
      - '.github/workflows/phone-empire-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate original pixel-art rooms
        run: |
          python3 -m pip install --user pillow numpy
          python3 phone-empire/tools/generate_rooms.py
          du -h phone-empire/src/main/assets/rooms/*
      - name: Build APK
        run: gradle :phone-empire:assembleDebug --no-daemon --stacktrace
      - name: Validate APK and size
        shell: bash
        run: |
          APK="phone-empire/build/outputs/apk/debug/phone-empire-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -ge 30000000
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "name='com.pirtech.phoneempire'" /tmp/badging.txt
          grep -q "versionName='1.1.0'" /tmp/badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SOULBOUND-1.1.0-APK
          path: phone-empire/build/outputs/apk/debug/phone-empire-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: soulbound-v1.1.0
          name: SOULBOUND 1.1.0
          body: |
            SOULBOUND — original 2D pixel-art room adventure for Android.
            Top-down movement, eight explorable rooms, NPC conversations,
            collectible memory shards, original generated room artwork.
            Landscape orientation. Russian story and touch controls.
            Package: com.pirtech.phoneempire
          files: phone-empire/build/outputs/apk/debug/phone-empire-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          token: ${{ github.token }}
