name: Build Pip RU APK

on:
  push:
    paths:
      - 'pip-ru/**'
      - '.github/workflows/pip-ru.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Pip RU APK
        run: gradle -p pip-ru :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="pip-ru/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pip-RU-APK
          path: pip-ru/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
