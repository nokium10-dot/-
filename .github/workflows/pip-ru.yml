name: Build original Pip RU APK

on:
  push:
    paths:
      - 'pip-ru/**'
      - 'pip/android/customize_sim.py'
      - '.github/workflows/pip-ru.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      - name: Checkout original Pip-KeyPet simulator
        uses: actions/checkout@v4
        with:
          repository: NovikovVisuals/Pip-KeyPet
          ref: main
          path: pip-src
          submodules: recursive

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and package original Pip simulator
        run: |
          emcmake cmake -S pip-src/sim -B pip-src/build-web -G Ninja
          cmake --build pip-src/build-web --parallel
          npm install --prefix /tmp/pip-web three@0.170.0
          mkdir -p pip-ru/app/src/main/assets/pip/three/addons
          cp pip-src/sim/web/index.html pip-ru/app/src/main/assets/pip/index.html
          cp pip-src/sim/web/pip.js pip-ru/app/src/main/assets/pip/pip.js
          cp pip-src/sim/web/pip.wasm pip-ru/app/src/main/assets/pip/pip.wasm
          cp /tmp/pip-web/node_modules/three/build/three.module.js pip-ru/app/src/main/assets/pip/three.module.js
          cp -R /tmp/pip-web/node_modules/three/examples/jsm/. pip-ru/app/src/main/assets/pip/three/addons/
          sed -i 's#https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js#./three.module.js#g; s#https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/#./three/addons/#g' pip-ru/app/src/main/assets/pip/index.html
          sed 's#pip/src/main/assets/pip/index.html#pip-ru/app/src/main/assets/pip/index.html#' pip/android/customize_sim.py > /tmp/customize-pip-ru.py
          python /tmp/customize-pip-ru.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Pip RU APK
        run: gradle -p pip-ru :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="pip-ru/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pip-RU-Original-APK
          path: pip-ru/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
