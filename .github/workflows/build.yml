name: Build MatrixWall Pro APK

on:
  push:
    paths:
      - 'MatrixWall-source.tar.gz.b64'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android project
        run: |
          base64 --decode MatrixWall-source.tar.gz.b64 | tar -xz
          test -f MatrixWall/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: MatrixWall
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MatrixWall-Pro-APK
          path: MatrixWall/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
