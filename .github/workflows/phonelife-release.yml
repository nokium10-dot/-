name: Phone Life 3D Release

on:
  push:
    branches: [main]
    paths:
      - 'phonelife/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/phonelife-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Phone Life 3D
        run: gradle :phonelife:assembleDebug --no-daemon --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          APK="phonelife/build/outputs/apk/debug/phonelife-debug.apk"
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 10000
          unzip -t "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/phone-life-badging.txt
          grep -q "name='com.phonelife.sim'" /tmp/phone-life-badging.txt
          grep -q "versionName='1.1.0'" /tmp/phone-life-badging.txt
          echo "Validated APK size: $(stat -c%s "$APK") bytes"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phone-Life-3D-1.1.0
          path: phonelife/build/outputs/apk/debug/phonelife-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Phone Life 3D release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phonelife-v1.1.0
          name: Phone Life 3D 1.1.0
          body: |
            Phone Life 3D Android build, version 1.1.0.
            Debug-signed APK for direct installation and testing.
            Package: com.phonelife.sim
          files: phonelife/build/outputs/apk/debug/phonelife-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          token: ${{ github.token }}
