<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Пип</title>
<style>
  :root { --lvl: 0; --bottom: 0px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: #eef1fa;
    font: 500 16px/1.3 system-ui, -apple-system, 'Roboto', sans-serif; }
  body.widget { visibility: hidden; }
  #sheet { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    padding: 10px 20px calc(var(--bottom) + 14px); border-radius: 28px 28px 0 0;
    background: radial-gradient(120% 80% at 50% 0%, #1a2036 0%, #0b0d15 70%);
    box-shadow: 0 -12px 40px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .07); }
  .grab { flex: none; width: 42px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .22); }
  #close { position: absolute; z-index: 5; top: 12px; right: 14px; width: 40px; height: 40px; border: 0; border-radius: 50%;
    background: rgba(255, 255, 255, .08); color: #c9d0e6; font-size: 20px; line-height: 40px; padding: 0; }
  #faceWrap { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; margin-top: 6px; }
  #glow { position: absolute; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .35s;
    box-shadow: 0 0 calc(24px + var(--lvl) * 60px) calc(2px + var(--lvl) * 14px) rgba(110, 231, 210, calc(.28 + var(--lvl) * .5)); }
  body.listening #glow, body.hearing #glow { opacity: 1; }
  #cv { position: relative; border-radius: 50%; background: #000; touch-action: none; }
  #said { flex: none; min-height: 22px; max-width: 100%; text-align: center; color: #98a3c4; font-size: 15px; font-style: italic;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #reply { flex: none; min-height: 28px; margin: 4px 0 10px; text-align: center; font-size: 20px; font-weight: 650; letter-spacing: .1px; }
  #mic { flex: none; width: 64px; height: 64px; border: 0; border-radius: 50%; padding: 0; color: #06201b; font-size: 28px;
    background: linear-gradient(135deg, #6ee7d2, #5aa9ff); box-shadow: 0 6px 22px rgba(90, 169, 255, .35);
    transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
  #mic:active { transform: scale(.9); }
  body.listening #mic, body.hearing #mic { animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(110, 231, 210, .5); } 50% { box-shadow: 0 0 0 16px rgba(110, 231, 210, 0); } }
  body.error #reply { color: #ffb4a8; font-size: 17px; font-weight: 550; }
</style>
</head>
<body>
<div id="sheet">
  <div class="grab"></div>
  <button id="close" aria-label="Закрыть">✕</button>
  <div id="faceWrap"><div id="glow"></div><canvas id="cv" width="466" height="466"></canvas></div>
  <div id="said"></div>
  <div id="reply">Привет!</div>
  <button id="mic" aria-label="Слушать">🎙</button>
</div>

<script type="module">
const params = new URLSearchParams(location.search);
const MODE = params.get('mode') === 'widget' ? 'widget' : 'overlay';
const W = window.PipWidget || null, O = window.PipOverlay || null;
const S = 466, FW = 233;
document.body.classList.add(MODE);
const $ = (id) => document.getElementById(id);

const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* нет хранилища */ } },
};

/* ---------- симулятор Пипа (тот же wasm, что в приложении) ---------- */
let M;
try {
  const mod = await import('./pip.js');
  M = await mod.default({ locateFile: (p) => p });
} catch (e) {
  if (MODE === 'overlay') { $('reply').textContent = 'Пип не загрузился'; }
  throw e;
}
M._sim_init((Math.random() * 2 ** 31) >>> 0);
const TZ = -new Date().getTimezoneOffset();
let clockOffset = +(store.get('keypet.clockOffset') || 0);
const simNow = () => Date.now() / 1000 + clockOffset;
const saved = store.get('keypet.pet');
if (saved) {
  try {
    const bytes = Uint8Array.from(atob(saved), (c) => c.charCodeAt(0));
    M.HEAPU8.set(bytes, M._sim_pet_buf());
    M._sim_pet_restore(bytes.length);
  } catch (e) { /* начнём с нового питомца */ }
}
M._sim_time(simNow(), TZ);
function savePet() {
  try {
    const n = M._sim_pet_save(), p = M._sim_pet_buf();
    store.set('keypet.pet', btoa(String.fromCharCode(...M.HEAPU8.subarray(p, p + n))));
  } catch (e) { /* ничего страшного */ }
}

/* ---------- шаг симуляции ---------- */
let last = performance.now(), carry = 0;
function stepSim() {
  const now = performance.now();
  const dt = Math.min(now - last, 250);
  last = now;
  carry += dt;
  const ms = Math.floor(carry);
  carry -= ms;
  M._sim_imu(0, 1, 0, dt / 1000);
  M._sim_gyro(0, 0, 0, dt / 1000);
  M._sim_time(simNow(), TZ);
  M._sim_frame(Math.max(ms, 1));
}

const moodIndex = (name) => {
  for (let i = 0; i < M._sim_mood_count(); i++) if (M.UTF8ToString(M._sim_mood_name(i)) === name) return i;
  return -1;
};
const later = (fn, ms) => setTimeout(fn, ms);
const touch = (x, y, on) => M._sim_touch(x, y, on);
let activeUntil = 0;
const wake = (ms) => { activeUntil = Math.max(activeUntil, performance.now() + (ms || 6000)); };

const api = {
  feed() { M._sim_action(0); },
  play() { M._sim_action(1); },
  poke() { touch(233, 233, 1); later(() => touch(233, 233, 0), 90); },
  pet() {
    touch(150, 240, 1);
    for (let i = 1; i <= 50; i++) later(() => touch(i % 8 < 4 ? 320 : 150, 240 + (i % 3) * 6, 1), i * 50);
    later(() => touch(150, 240, 0), 51 * 50);
  },
  mood(name) { const i = moodIndex(name); if (i < 0) return false; M._sim_set_mood(i); return true; },
  auto() { M._sim_auto(1); },
  volume(v) { M._sim_volume(v); },
  status() { try { return JSON.parse(M.UTF8ToString(M._sim_status())); } catch (e) { return {}; } },
};

/* ---------- виджет: кадры уходят в Java ---------- */
let timer = 0, saveTimer = 0, tickN = 0, running = false;
const out16 = new Uint16Array(FW * FW);
function sendFrame() {
  if (!W || !M._sim_display_on()) return;
  const fb = new Uint16Array(M.HEAPU16.buffer, M._sim_fb(), S * S);
  let o = 0;
  for (let y = 0; y < FW; y++) {
    let i = y * 2 * S;
    for (let x = 0; x < FW; x++, i += 2, o++) {
      const a = fb[i], b = fb[i + 1], c = fb[i + S], d = fb[i + S + 1];
      const r = ((a >> 11) + (b >> 11) + (c >> 11) + (d >> 11)) >> 2;
      const g = (((a >> 5) & 63) + ((b >> 5) & 63) + ((c >> 5) & 63) + ((d >> 5) & 63)) >> 2;
      const bl = ((a & 31) + (b & 31) + (c & 31) + (d & 31)) >> 2;
      out16[o] = (r << 11) | (g << 5) | bl;
    }
  }
  const bytes = new Uint8Array(out16.buffer);
  let s = '';
  for (let k = 0; k < bytes.length; k += 0x4000) s += String.fromCharCode.apply(null, bytes.subarray(k, k + 0x4000));
  W.frame(btoa(s));
}
function widgetTick() {
  stepSim();
  tickN++;
  const active = performance.now() < activeUntil;
  if (active || tickN % 2 === 0) sendFrame();
}

/* ---------- оверлей помощника ---------- */
const cv = $('cv'), ctx2 = MODE === 'overlay' ? cv.getContext('2d') : null;
let img, px32, raf = 0;
const lut5 = Array.from({ length: 32 }, (_, i) => Math.round(i * 255 / 31));
const lut6 = Array.from({ length: 64 }, (_, i) => Math.round(i * 255 / 63));
if (ctx2) { img = ctx2.createImageData(S, S); px32 = new Uint32Array(img.data.buffer); }
function blit() {
  const fb = new Uint16Array(M.HEAPU16.buffer, M._sim_fb(), S * S);
  for (let i = 0; i < S * S; i++) {
    const c = fb[i];
    px32[i] = 0xff000000 | (lut5[c & 31] << 16) | (lut6[(c >> 5) & 63] << 8) | lut5[c >> 11];
  }
  ctx2.putImageData(img, 0, 0);
}
function overlayFrame() {
  stepSim();
  blit();
  raf = requestAnimationFrame(overlayFrame);
}

function fit() {
  const w = $('faceWrap');
  const size = Math.max(80, Math.min(w.clientWidth, w.clientHeight, 300));
  cv.style.width = cv.style.height = size + 'px';
  const g = $('glow'); g.style.width = g.style.height = size + 'px';
}

/* пружина для выезда Пипа */
function springKeyframes(from, to, steps) {
  const k = 170, c = 14, kf = []; let x = from, v = 0;
  for (let i = 0; i <= steps; i++) { kf.push(x); for (let j = 0; j < 4; j++) { const a = -k * (x - to) - c * v; v += a * (1 / 240); x += v * (1 / 240); } }
  return kf;
}

/* ---------- голосовые команды ---------- */
const norm = (t) => t.toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const MOODS = [
  [/радост|улыбн|веселис|весело/, 'happy', 'Ура, я рад!'], [/груст|грустн|плач/, 'sad', 'Мне грустно…'],
  [/разозл|злис|сердис|в ярост/, 'angry', 'Гр-р-р!'], [/удив/, 'surprised', 'Ого!'],
  [/влюб|обожаю|люблю тебя/, 'love', 'Я тоже тебя люблю!'], [/испуг|бойс|страшно|испугай/, 'afraid', 'Ой, страшно!'],
  [/смущ|засте|стесня/, 'shy', 'Ой, я стесняюсь…'], [/скуч/, 'bored', 'Скучно…'],
  [/закруж|головокруж/, 'dizzy', 'Ой, кружится голова!'], [/кивни|согласи/, 'yes', 'Да!'],
  [/покачай головой|откажи|скажи нет/, 'no', 'Нет!'], [/самодов|задавак|красуй/, 'smug', 'Я такой молодец.'],
  [/дерзк|нагл/, 'cheeky', 'Хе-хе!'], [/обидись|обиж/, 'hurt', 'Мне обидно…'],
  [/подозр|прищур/, 'suspicious', 'Хм… подозрительно.'], [/доволен|комфорт|расслабь/, 'content', 'Мне хорошо.'],
];
const NEED_TEXT = { food: 'Я проголодался.', energy: 'Я хочу спать.', fun: 'Мне хочется поиграть.', love: 'Мне не хватает ласки.', walk: 'Хочу погулять.' };
let moodT = 0, closeT = 0;
function describeState() {
  const st = api.status();
  let worst = null, min = 1;
  for (const k of Object.keys(NEED_TEXT)) if (typeof st[k] === 'number' && st[k] < min) { min = st[k]; worst = k; }
  return worst && min < 0.35 ? NEED_TEXT[worst] : 'У меня всё хорошо!';
}
function handle(raw) {
  const t = norm(raw), has = (re) => re.test(t);
  if (has(/что ты умеешь|помощь|какие команды|помоги/)) return 'Скажи: покорми, поиграй, погладь, усни, как дела, который час.';
  if (has(/как тебя зовут|кто ты/)) return 'Я Пип, твой питомец из брелока!';
  if (has(/покорм|накорм|кормить|дай (поесть|еды|покушать)|проголодал|есть хочешь/)) { api.feed(); return 'Ням-ням! Спасибо!'; }
  if (has(/поигра|давай играть|играть|развлек/)) { api.play(); return 'Давай играть!'; }
  if (has(/погладь|поглади|приласкай|обними|почеши/)) { api.pet(); return 'Мне приятно!'; }
  if (has(/ткни|потыкай|тык/)) { api.poke(); return 'Ой!'; }
  if (has(/проснись|просыпайся|вставай|доброе утро/)) { api.mood('woke up'); later(api.auto, 2600); return 'Доброе утро!'; }
  if (has(/усни|засыпай|спокойной ночи|баиньки|иди спать|спи/)) { api.mood('asleep'); return 'Спокойной ночи… хр-р.'; }
  if (has(/открой (меню|приложение|пипа)|покажи меню|^меню$/)) { if (O) O.openApp(); return 'Открываю!'; }
  if (has(/который час|сколько времени|скажи время|^время$/)) return 'Сейчас ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  if (has(/какое сегодня число|какой сегодня день|какая сегодня дата|какое число/)) return 'Сегодня ' + new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  if (has(/как дела|как ты|как настроение|как себя чувствуешь|что чувствуешь/)) return describeState();
  if (has(/выключи звук|без звука|замолчи|тише/)) { api.volume(0); return 'Молчу.'; }
  if (has(/включи звук|громче|со звуком/)) { api.volume(0.8); return 'Звук включён!'; }
  if (has(/закройся|закрой|пока|до свидания|отбой|хватит/)) { closeT = later(() => O && O.close(), 1500); return 'Пока-пока!'; }
  for (const [re, mood, reply] of MOODS) if (has(re) && api.mood(mood)) { clearTimeout(moodT); moodT = later(api.auto, 9000); return reply; }
  if (has(/привет|здравствуй|добрый день|добрый вечер|хай/)) { api.mood('happy'); moodT = later(api.auto, 5000); return 'Привет! Я Пип.'; }
  if (has(/спасибо|молодец|умница|хороший/)) { api.mood('love'); moodT = later(api.auto, 5000); return 'Мне так приятно!'; }
  return 'Не понял. Скажи «что ты умеешь».';
}

/* ---------- API для Java ---------- */
const setState = (s) => { document.body.classList.remove('listening', 'hearing', 'thinking', 'error'); if (s) document.body.classList.add(s); };
function start() {
  if (running) return;
  running = true;
  last = performance.now();
  if (MODE === 'widget') {
    timer = setInterval(widgetTick, 100);
    saveTimer = setInterval(savePet, 7000);
  } else {
    raf = requestAnimationFrame(overlayFrame);
    saveTimer = setInterval(savePet, 3000);
  }
}
function stop() {
  if (!running) return;
  running = false;
  clearInterval(timer); clearInterval(saveTimer); cancelAnimationFrame(raf);
  savePet();
}

window.pipFace = {
  act(name) { wake(); if (api[name]) api[name](); },
  pause: stop,
  resume() { start(); },
  save: savePet,
  inset(dp) { document.documentElement.style.setProperty('--bottom', dp + 'px'); fit(); },
  enter() {
    clearTimeout(closeT);
    $('said').textContent = ''; $('reply').textContent = 'Слушаю…'; setState('listening');
    const wrap = $('faceWrap');
    const ys = springKeyframes(110, 0, 40), ss = springKeyframes(0.45, 1, 40);
    wrap.animate(ys.map((y, i) => ({ transform: 'translateY(' + y + 'px) scale(' + ss[i] + ')', opacity: Math.min(1, i / 6) })),
      { duration: 700, easing: 'linear', fill: 'backwards' });
    api.mood('curious');
  },
  state(s, msg) {
    clearTimeout(closeT);
    if (s === 'listening') { setState('listening'); $('reply').textContent = 'Слушаю…'; $('said').textContent = ''; api.mood('curious'); }
    else if (s === 'hearing') { setState('hearing'); }
    else if (s === 'thinking') { setState('thinking'); $('reply').textContent = 'Думаю…'; }
    else if (s === 'error') { setState('error'); $('reply').textContent = msg || 'Не получилось'; api.auto(); }
  },
  level(v) { document.documentElement.style.setProperty('--lvl', String(v)); },
  partial(text) { $('said').textContent = '«' + text + '»'; },
  heard(text) {
    setState(''); api.auto();
    document.documentElement.style.setProperty('--lvl', '0');
    $('said').textContent = '«' + text + '»';
    const reply = handle(text);
    $('reply').textContent = reply;
    if (O) { O.speak(reply); O.haptic(); }
  },
};

if (MODE === 'overlay') {
  addEventListener('resize', fit);
  fit();
  $('mic').onclick = () => { if (O) O.listen(); };
  $('close').onclick = () => { if (O) O.close(); };
  /* касания лица: тык и поглаживание, как на брелоке */
  const pt = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * S, (e.clientY - r.top) / r.height * S]; };
  let down = false;
  cv.addEventListener('pointerdown', (e) => { down = true; cv.setPointerCapture(e.pointerId); const p = pt(e); touch(p[0], p[1], 1); });
  cv.addEventListener('pointermove', (e) => { if (down) { const p = pt(e); touch(p[0], p[1], 1); } });
  const up = (e) => { if (!down) return; down = false; const p = pt(e); touch(p[0], p[1], 0); };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  /* голос Пипа (синтез из wasm) */
  try {
    const ac = new AudioContext();
    M._sim_voice_init(ac.sampleRate);
    const node = ac.createScriptProcessor(1024, 0, 1);
    node.onaudioprocess = (e) => {
      const o = e.outputBuffer.getChannelData(0);
      const pcm = new Int16Array(M.HEAPU16.buffer, M._sim_audio(o.length), o.length);
      for (let i = 0; i < o.length; i++) o[i] = pcm[i] / 32768;
    };
    node.connect(ac.destination);
    M._sim_volume(0.7);
    const resume = () => { if (ac.state === 'suspended') ac.resume(); };
    addEventListener('pointerdown', resume);
    resume();
  } catch (e) { /* без звука Пипа */ }
} else {
  wake(4000);
}

start();
if (MODE === 'widget' && W) W.ready();
if (MODE === 'overlay' && O) O.ready();
</script>
</body>
</html>
